name: Publish anchor-escrow-sdk

on:
  push:
    tags:
      - "escrow-sdk-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm trusted publishing (OIDC) + provenance

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure recent npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @trib3/anchor-escrow-sdk build

      - name: Publish
        working-directory: anchor-escrow/sdk
        run: npm publish --access public --tag ${{ inputs.tag || 'latest' }}
